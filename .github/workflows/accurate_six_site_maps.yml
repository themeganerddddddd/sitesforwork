name: Generate accurate six-site maps

on:
  push:
    branches:
      - accurate-six-site-map-exports
    paths:
      - 'map_exports/generate_maps.py'
      - 'map_exports/street_map_areas.py'
      - '.github/workflows/accurate_six_site_maps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install map dependencies
        run: python -m pip install --quiet requests pillow
      - name: Capture literal street basemap with verified boundary and six community labels
        run: python map_exports/street_map_areas.py
      - name: Commit PNG screenshots into the isolated map-export branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps/six_sites_literal_streets_areas.png maps/six_sites_literal_light_streets_areas.png
          git diff --cached --quiet || (git commit -m "Publish six-site literal street screenshots with community labels" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: six-sites-literal-map-captures
          path: maps/*.png
